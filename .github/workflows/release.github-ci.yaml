name: Create release

on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  release:
    name: Release pushed tag
    runs-on: self-hosted
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up GitHub CLI
        uses: cli/cli-action@v2
      
      - name: Download MinGW build
        uses: actions/download-artifact@v4
        with:
          name: mingw-build
          path: mingw

      - name: Download MSVC build
        uses: actions/download-artifact@v4
        with:
          name: msvc-build
          path: msvc

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}
          body: |
            ## Release Notes
            - Release created by GitHub Actions
            - Version: ${{ github.ref_name }}
            - Commit: ${{ github.sha }}
          files: |
            mingw/mingw_binary/*
            msvc/msvc_binary/*
