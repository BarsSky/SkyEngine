#file: noinspection YAMLSchemaValidation
name: sky engine build

#run on push
on: 
  push:
    branches:
      - cicd-dev
      - master
    tags:
      - v*
  pull_request:
    branches:
      - master

jobs:
  build:
    name: build
    runs-on: self-hosted
    steps:
      - name: checkout and build
        uses: actions/checkout@v2

      - name: cmake build for MINGW
        run: |
          cmake -G "MinGW Makefiles" -B build_mingw -DCMAKE_INSTALL_PREFIX=mingw_binary .
          cmake --build build_mingw --target install -j12
          Compress-Archive -Path mingw_binary\* -DestinationPath SkyEngine_mingw.zip

      - name: cmake build for MSVC
        run: |
          cmake -G "Visual Studio 17 2022" -A x64 -B build_msvc -DCMAKE_INSTALL_PREFIX=msvc_binary .
          cmake --build build_msvc --target install -j 12
          Compress-Archive -Path msvc_binary\* -DestinationPath SkyEngine_msvc.zip

      - name: Upload build artifacts MINGW
        uses: actions/upload-artifact@v4
        with:
          name: mingw-build
          path: ./SkyEngine_mingw.zip

      - name: Upload build artifacts MSVC
        uses: actions/upload-artifact@v4
        with:
          name: msvc-build
          path: ./SkyEngine_msvc.zip  

  release:
    name: Release pushed tag
    runs-on: self-hosted
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download MinGW build
        uses: actions/download-artifact@v4
        with:
          name: mingw-build
          path: mingw

      - name: Download MSVC build
        uses: actions/download-artifact@v4
        with:
          name: msvc-build
          path: msvc

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}
          body: |
            ## Release Notes
            - Release created by GitHub Actions
            - Version: ${{ github.ref_name }}
            - Commit: ${{ github.sha }}
          files: |
            mingw/**
            msvc/**

