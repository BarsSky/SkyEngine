#file: noinspection YAMLSchemaValidation
name: sky engine build

#run on push
on: 
  push:
    branches:
      - cicd-dev
      - master
    tags:
      - v*
  pull_request:
    branches:
      - master

jobs:
  build:
    name: build
    runs-on: self-hosted
    steps:
      - name: checkout and build
        uses: actions/checkout@v2

      - name: cmake build for MINGW
        run: |
          cmake -G "MinGW Makefiles" -B build_mingw -DCMAKE_INSTALL_PREFIX=mingw_binary -DGLFW_LIB_ENABLE=ON -DQT_LIB_ENABLE=OFF .
          cmake --build build_mingw --target install -j12
          Compress-Archive -Path .\mingw_binary\ -DestinationPath SkyEngine_mingw.zip

      - name: cmake build for MSVC
        run: |
          cmake -G "Visual Studio 17 2022" -A x64 -B build_msvc -DCMAKE_INSTALL_PREFIX=msvc_binary -DGLFW_LIB_ENABLE=ON -DQT_LIB_ENABLE=OFF .
          cmake --build build_msvc --target install -j 12
          Compress-Archive -Path .\msvc_binary\ -DestinationPath SkyEngine_msvc.zip

      - name: cmake build for MINGW QT
        run: |
          cmake -G "MinGW Makefiles" -B build_mingwQT -DCMAKE_INSTALL_PREFIX=mingw_binaryQT -DQT_LIB_ENABLE=ON -DGLFW_LIB_ENABLE=OFF -DQT_PATH=C:/Qt/5.15.2/ .
          cmake --build build_mingwQT --target install -j12
          Compress-Archive -Path .\mingw_binaryQT\ -DestinationPath SkyEngine_mingwQT.zip

      # - name: cmake build for MSVC QT
      #   run: |
      #     cmake -G "Visual Studio 17 2022" -A x64 -B build_msvc_QT -DCMAKE_INSTALL_PREFIX=msvc_binary_QT .
      #     cmake --build build_msvc_QT --target install -j 12
      #     Compress-Archive -Path msvc_binary\* -DestinationPath SkyEngine_msvc.zip

      - name: Upload build artifacts MINGW
        uses: actions/upload-artifact@v4
        with:
          name: mingw-build
          path: ./SkyEngine_mingw.zip

      - name: Upload build artifacts MINGWQT
        uses: actions/upload-artifact@v4
        with:
          name: mingwQT-build
          path: ./SkyEngine_mingwQT.zip

      - name: Upload build artifacts MSVC
        uses: actions/upload-artifact@v4
        with:
          name: msvc-build
          path: ./SkyEngine_msvc.zip  

      # - name: Run cppcheck (static analysis)
      #   run: |
      #     cppcheck --enable=all --inconclusive --quiet --error-exitcode=1 --project=build_mingw/compile_commands.json || true
      #     cppcheck --enable=all --inconclusive --quiet --error-exitcode=1 --project=build_msvc/compile_commands.json || true
      #     cppcheck --enable=all --inconclusive --quiet --error-exitcode=1 --project=build_mingwQT/compile_commands.json || true
      #   continue-on-error: true

      # - name: Run clang-tidy (static analysis)
      #   run: |
      #     clang-tidy -p build_mingw $(find . -name '*.cpp') || true
      #     clang-tidy -p build_msvc $(find . -name '*.cpp') || true
      #     clang-tidy -p build_mingwQT $(find . -name '*.cpp') || true
      #   continue-on-error: true

  release:
    name: Release pushed tag
    runs-on: self-hosted
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download MinGW build
        uses: actions/download-artifact@v4
        with:
          name: mingw-build
          path: mingw

      - name: Download MinGWQT build
        uses: actions/download-artifact@v4
        with:
          name: mingwQT-build
          path: mingwQT

      - name: Download MSVC build
        uses: actions/download-artifact@v4
        with:
          name: msvc-build
          path: msvc

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}
          body: |
            ## Release Notes
            - Release created by GitHub Actions
            - Version: ${{ github.ref_name }}
            - Commit: ${{ github.sha }}
            
            ### External Assets
            Dependent object models for the engine can be downloaded here:
            https://skynas.ru/drive/d/s/13VBfaNNxGKfR9gaKl0iHTSflAjBChSC/gUiOJs3FiHwjfWGYhV-SflULByETWv7C-1bUgKIhDTgw
            
            ---
          files: |
            mingw/**
            mingwQT/**
            msvc/**

