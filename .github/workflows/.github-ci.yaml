#file: noinspection YAMLSchemaValidation
name: sky engine build

#run on push
on: 
  push:
    branches:
      - cicd-dev
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    name: build
    runs-on: self-hosted
    steps:
      - name: checkout and build
        uses: actions/checkout@v2

      - name: cmake build for MINGW
        run: |
          cmake -G "MinGW Makefiles" -B build -DCMAKE_INSTALL_PREFIX=./mingw_binary .
          cmake --build build --target install

      - name: cmake build for MSVC
        run: |
          cmake --fresh
          cmake -G "Visual Studio 17 2022" -A x64 -B build -DCMAKE_INSTALL_PREFIX=./msvc_binary.
          cmake --build build --target install

      - name: Upload build artifacts MINGW
        uses: actions/upload-artifact@v4
        with:
          name: mingw-build
          path: ./mingw_binary

      - name: Upload build artifacts MSVC
        uses: actions/upload-artifact@v4
        with:
          name: msvc-build
          path: ./msvc_binary  
